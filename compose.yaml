# Dokploy compose for a Nitro + Arcturus Morningstar + AtomCMS hotel.
# No published ports: attach domains in Dokploy's "Domains" tab (see README).
# Services that get a domain declare `networks: [default]` so they keep internal
# DNS when Dokploy appends dokploy-network.

x-db-creds: &db-creds
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: arcturus
  DB_USERNAME: arcturus
  DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}

services:
  db:
    build: ./db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: arcturus
      MYSQL_USER: arcturus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # only used on first init, see db/99-settings.sh
      GAME_DOMAIN: ${GAME_DOMAIN:?set GAME_DOMAIN}
      ASSETS_DOMAIN: ${ASSETS_DOMAIN:?set ASSETS_DOMAIN}
      # X-Real-Ip behind plain Traefik, CF-Connecting-IP behind Cloudflare proxy
      WS_IP_HEADER: ${WS_IP_HEADER:-X-Real-Ip}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds after the init scripts finish (init server runs without networking)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  # Daily gzipped dump, 7 days kept. Copy /backup off-server (e.g. Dokploy volume backups to S3).
  # ponytail: sleep loop, not cron; drifts by dump duration per day, fine for a hobby hotel.
  backup:
    image: mysql:8
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backup/arcturus-$$(date +%F).sql.gz
          mysqldump -h db -u arcturus --single-transaction --no-tablespaces arcturus | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup: $$f"
          find /backup -name '*.sql.gz' -mtime +7 -delete
          sleep 86400
        done
    volumes:
      - db-backup:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  arcturus:
    build: ./arcturus
    environment:
      DB_HOSTNAME: db
      DB_PORT: 3306
      DB_DATABASE: arcturus
      DB_USERNAME: arcturus
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_PARAMS: ""
      EMU_HOST: 0.0.0.0
      EMU_PORT: 3000
      RCON_HOST: 127.0.0.1
      RCON_PORT: 3001
      RCON_ALLOWED: 127.0.0.1
      RT_THREADS: 8
    volumes:
      - assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
    networks: [default]
    restart: unless-stopped

  # Static asset server (domain: ASSETS_DOMAIN -> port 80). Also proxies /api/imager and /api/imageproxy.
  assets:
    image: nginx:alpine
    volumes:
      - ./assets/nginx:/etc/nginx/conf.d:ro
      - assets:/usr/share/nginx/html
    depends_on:
      - imager
      - imgproxy
    networks: [default]
    restart: unless-stopped

  # One-shot: fills the `assets` volume on first deploy (several GB, takes a while). No-op afterwards.
  assets-init:
    build: ./assets
    volumes:
      - assets:/data
    depends_on:
      - assets
    restart: "no"

  imager:
    build: ./imager
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      AVATAR_SAVE_PATH: /app/assets/usercontent/avatar/
      AVATAR_ACTIONS_URL: http://assets/assets/gamedata/HabboAvatarActions.json
      AVATAR_FIGUREDATA_URL: http://assets/assets/gamedata/FigureData.json
      AVATAR_FIGUREMAP_URL: http://assets/assets/gamedata/FigureMap.json
      AVATAR_EFFECTMAP_URL: http://assets/assets/gamedata/EffectMap.json
      AVATAR_ASSET_URL: http://assets/assets/bundled/figure/%libname%.nitro
      AVATAR_ASSET_EFFECT_URL: http://assets/assets/bundled/effect/%libname%.nitro
    volumes:
      - assets:/app/assets
    restart: unless-stopped

  imgproxy:
    image: ghcr.io/willnorris/imageproxy
    environment:
      IMAGEPROXY_ADDR: 0.0.0.0:8080
      IMAGEPROXY_CACHE: /tmp/imageproxy
    volumes:
      - imgproxy-cache:/tmp/imageproxy
    restart: unless-stopped

  # Game client (domain: GAME_DOMAIN -> port 80)
  nitro:
    build: ./nitro
    environment:
      SOCKET_URL: wss://${WS_DOMAIN:?set WS_DOMAIN}
      ASSETS_URL: https://${ASSETS_DOMAIN}
      CMS_URL: https://${CMS_DOMAIN:?set CMS_DOMAIN}
    networks: [default]
    restart: unless-stopped

  # Website + registration + housekeeping (domain: CMS_DOMAIN -> port 8080)
  cms:
    build: ./atomcms
    environment:
      <<: *db-creds
      DB_CONNECTION: mysql
      APP_NAME: ${HOTEL_NAME:-Habbo}
      APP_ENV: production
      APP_KEY: ${APP_KEY:?set APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://${CMS_DOMAIN}
      APP_LOCALE: ${APP_LOCALE:-en}
      FORCE_HTTPS: "true"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      RCON_HOST: arcturus
      RCON_PORT: 3001
      NITRO_CLIENT_PATH: https://${GAME_DOMAIN}
      THEME: ${CMS_THEME:-dusk}
      ASSETS_DOMAIN: ${ASSETS_DOMAIN}
      # must be strings, not unset: AtomCMS builds the Turnstile client on every registration
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - cms-storage:/var/www/html/storage/app/public
      - cms-logs:/var/www/html/storage/logs
      - cms-gamedata:/var/www/html/public/gamedata
    depends_on:
      db:
        condition: service_healthy
    networks: [default]
    restart: unless-stopped

volumes:
  db-data:
  db-backup:
  assets:
  imgproxy-cache:
  cms-storage:
  cms-logs:
  cms-gamedata:
